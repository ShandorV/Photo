<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Preview</title>

<!-- Підключення шрифтів Playfair Display та Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', Arial, sans-serif;
    background-color: #0f0e0d;
    background-image: 
        radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(20, 18, 16, 0.8) 0%, #0f0e0d 100%);
    color:#e5e0d8;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding: 20px 12px;
}

.container{
    width:100%;
    max-width:550px;
    padding: clamp(24px, 5vw, 50px) clamp(16px, 4vw, 40px);
    border-radius:20px;
    background:rgba(22, 20, 18, 0.85);
    border:1px solid rgba(197, 160, 89, 0.2);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
}

h1{
    text-align:center;
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    color: #f2ede4;
}

.subtitle{
    text-align:center;
    color:#a39b8e;
    font-size: clamp(0.75rem, 2.5vw, 0.9rem);
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: clamp(20px, 4vw, 35px);
    text-transform: uppercase;
}

.grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

.photo-card{
    background: rgba(30, 27, 24, 0.6);
    border: 1px solid rgba(197, 160, 89, 0.15);
    border-radius: 14px;
    overflow: hidden;
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
    -webkit-tap-highlight-color: transparent;
}

.photo-card:hover, .photo-card:active {
    transform: translateY(-4px);
    border-color: rgba(197, 160, 89, 0.4);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(197, 160, 89, 0.1);
}

.photo-card-img-wrapper {
    overflow: hidden;
    position: relative;
}

.photo-card img{
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

.photo-card:hover img{
    transform: scale(1.03);
}

/* Підказка при наведенні або тапі */
.photo-card-img-wrapper::after {
    content: "🔍 Tap to view";
    position: absolute;
    inset: 0;
    background: rgba(15, 14, 13, 0.55);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f2ede4;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    opacity: 0;
    transition: opacity 0.3s ease;
}

@media (hover: hover) {
    .photo-card:hover .photo-card-img-wrapper::after {
        opacity: 1;
    }
}

.photo-card h3{
    padding: 16px 14px;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: clamp(1.05rem, 3vw, 1.25rem);
    color: #e5e0d8;
    letter-spacing: 0.5px;
    border-top: 1px solid rgba(197, 160, 89, 0.1);
}

.footer{
    margin-top: clamp(20px, 4vw, 35px);
    text-align: center;
    color: #7a7368;
    font-size: clamp(0.7rem, 2vw, 0.8rem);
    letter-spacing: 1px;
    text-transform: uppercase;
}

/* Modal / Lightbox Styles */
.lightbox-modal {
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 8, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.lightbox-modal.active {
    opacity: 1;
    pointer-events: auto;
}

.lightbox-content {
    max-width: 95vw;
    max-height: 82vh;
    border-radius: 8px;
    border: 1px solid rgba(197, 160, 89, 0.3);
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    transform: scale(0.95);
    transition: transform 0.3s ease;
    object-fit: contain;
}

.lightbox-modal.active .lightbox-content {
    transform: scale(1);
}

.lightbox-close {
    position: absolute;
    top: 15px;
    right: 20px;
    color: #e5e0d8;
    font-size: 3rem;
    font-weight: 300;
    cursor: pointer;
    line-height: 1;
    padding: 10px;
    transition: color 0.2s ease;
    z-index: 1001;
    -webkit-tap-highlight-color: transparent;
}

.lightbox-close:hover, .lightbox-close:active {
    color: #c5a059;
}
</style>
</head>

<body>

<div class="container">

    <h1>Photo Preview</h1>
    <p class="subtitle">Fine Gallery Display</p>

    <div class="grid">

        <div class="photo-card">
            <div class="photo-card-img-wrapper">
                <!-- ЗОБРАЖЕННЯ SIDE.PNG -->
                <img src="side.png" alt="Side Photo">
            </div>
            <h3>Gundel Restaurant</h3>
        </div>

    </div>

    <div class="footer">
        Ready to use • Fine Aesthetics • Click to Enlarge
    </div>

</div>

<!-- Lightbox Modal -->
<div class="lightbox-modal" id="lightboxModal">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-content" id="lightboxImage" src="" alt="Enlarged preview">
</div>

<script>
    const photoCards = document.querySelectorAll('.photo-card');
    const modal = document.getElementById('lightboxModal');
    const modalImg = document.getElementById('lightboxImage');
    const closeBtn = document.getElementById('lightboxClose');

    photoCards.forEach(card => {
        card.addEventListener('click', () => {
            const img = card.querySelector('img');
            if (img) {
                modalImg.src = img.src;
                modalImg.alt = img.alt;
                modal.classList.add('active');
            }
        });
    });

    const closeModal = () => {
        modal.classList.remove('active');
    };

    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            closeModal();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
            closeModal();
        }
    });
</script>

</body>
</html>
